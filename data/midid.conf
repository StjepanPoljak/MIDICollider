# midid configuration. Lives on the data partition; midid re-reads it
# whenever it changes (copy it to the card, or: tools/pi put data/midid.conf).

# SynthDef played on every channel...
synth piano
# ...unless a channel (1-16) has its own.
#synth 10 drums

# Program change messages (0-127 as sent on the wire; many keyboards
# display them as 1-128) switch the synth on that channel.
program 0 piano
program 1 epiano
program 2 pad

# cc <number> <control> <low> <high> [lin|exp]
# Applied to all sounding nodes and passed to new ones.
cc 1 cutoff 300 12000 exp

# Pitch bend range in semitones.
bend 2

# sample <midi note> <path relative to the data partition> [velocity]
# Used when the synth has buf/rate controls. The nearest sample in pitch is
# picked and pitch shifted, so every 3rd-4th note is plenty. With velocity
# layers (the same note at several velocities), the layer recorded nearest
# to the played velocity wins. The piano below comes from tools/prepare-piano.
# --- piano samples (written by tools/prepare-piano) ---
# sample <note> <path> <velocity the layer was recorded at>
sample 21 samples/piano/A0v12.flac 92
sample 21 samples/piano/A0v16.flac 124
sample 21 samples/piano/A0v4.flac 40
sample 21 samples/piano/A0v8.flac 60
