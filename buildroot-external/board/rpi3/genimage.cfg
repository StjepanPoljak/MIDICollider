# p1: boot (read-only on the Pi), p2: data (read-write, mounted at /data).
# Both are FAT so a laptop can edit them. Grow the data partition with any
# partition tool if 1 GB isn't enough for your samples.

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"bcm2710-rpi-3-b-plus.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"Image",
			"rootfs.cpio.gz"
		}
	}
	size = 64M
}

image data.vfat {
	vfat {
		label = "MCDATA"
		files = {
			"data/midid.conf",
			"data/scsynth.args",
			"data/synthdefs",
			"data/samples"
		}
	}
	size = 1G
}

image sdcard.img {
	hdimage {
		# SD cards write faster with aligned partitions
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition data {
		partition-type = 0xC
		image = "data.vfat"
	}
}
